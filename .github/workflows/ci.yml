# Builds and tests AMP FORGE on macOS (universal) and Linux for every push / PR.
name: CI
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Build and test (universal binary)
        run: Scripts/build_macos.sh
      - name: Launch smoke test
        run: |
          APP="build/macos/AmpForge_artefacts/Release/AMP FORGE.app"
          "$APP/Contents/MacOS/AMP FORGE" --smoke-test 5
      - uses: actions/upload-artifact@v4
        with:
          name: AMP-FORGE-macOS-unsigned
          path: build/macos/AmpForge_artefacts/Release/AMP FORGE.app
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev xvfb
      - name: Build and test
        run: Scripts/build.sh
      - name: Sanitizers
        run: Scripts/run_sanitizers.sh
      - name: Headless launch
        run: xvfb-run -a "build/release/AmpForge_artefacts/Release/AMP FORGE" --smoke-test 5
